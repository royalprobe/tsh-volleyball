# Holt alle 15 Minuten die Daten (holen.mjs) und veröffentlicht public/ auf GitHub Pages – nur, wenn sich etwas geändert hat.
# Zwei Jobs (holen, veröffentlichen): Im selben Job fand deploy-pages das gerade hochgeladene Artefakt oft noch nicht.
# Angestoßen wird er alle 15 Minuten von außen (cron-job.org ruft die GitHub-API „workflow_dispatch“ auf), weil GitHub
# den eigenen Zeitplan bei wenig genutzten Repos nur alle paar Stunden ausführt. Der Zeitplan unten bleibt als Rückfall.
name: Daten

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      erzwingen:
        description: 'Auch ohne Änderung veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write     # nur für das Lebenszeichen (siehe unten)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      veroeffentlichen: ${{ steps.holen.outputs.geaendert == 'true' || github.event_name == 'push' || inputs.erzwingen == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: holen
        run: node holen.mjs
        env:
          VORHER_URL: https://royalprobe.github.io/tsh-volleyball/stand.json
          VS_USER: ${{ secrets.VS_USER }}
          VS_PASS: ${{ secrets.VS_PASS }}
      - if: steps.holen.outputs.geaendert == 'true' || github.event_name == 'push' || inputs.erzwingen == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub schaltet zeitgesteuerte Workflows in öffentlichen Repos nach 60 Tagen ohne Commit ab –
      # darum alle 40 Tage ein leerer Commit als Lebenszeichen
      - name: Lebenszeichen
        run: |
          letzter=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - letzter )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Lebenszeichen (zeitgesteuerter Workflow bleibt aktiv)"
            git push
          fi

  veroeffentlichen:
    needs: holen
    if: needs.holen.outputs.veroeffentlichen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
